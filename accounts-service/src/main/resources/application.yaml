spring:
  application:
    name: accounts-service

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          account-service:
            provider: keycloak
            client-id: ${ACCOUNT_SERVICE_OAUTH2_CLIENT_ID:account-service}
            client-secret: ${ACCOUNT_SERVICE_OAUTH2_CLIENT_SECRET:fpbcLLRoXyEJolIXEfqMiRMsevqXZnXG}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    enabled: true

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:accounts}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    jpa:
      repositories:
        enabled: true
      properties:
        hibernate:
          default_schema: public
          ddl-auto: update

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      client-id: "5L6g3nShT-eMCtK--X86sw"
    producer:
      bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      client-id: "5L6g3nShT-eMCtK--X86sw"
      properties:
        spring.json.type.mapping: notificationRequest:yandex.workshop.api.model.NotificationRequest

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: debug

topic:
  notification: notifications