spring:
  application:
    name: accounts-service
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
    discovery:
      enabled: false

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          account-service:
            provider: keycloak
            client-id: ${ACCOUNT_SERVICE_OAUTH2_CLIENT_ID:account-service}
            client-secret: ${ACCOUNT_SERVICE_OAUTH2_CLIENT_SECRET:fpbcLLRoXyEJolIXEfqMiRMsevqXZnXG}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    enabled: true

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:accounts}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    jpa:
      repositories:
        enabled: true
      properties:
        hibernate:
          default_schema: public
          ddl-auto: update

bank:
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URl:http://localhost:8086}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: debug