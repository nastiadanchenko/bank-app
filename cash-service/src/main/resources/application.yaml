spring:
  application:
    name: cash-service
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
    discovery:
      enabled: false

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          cash-service:
            provider: keycloak
            client-id: ${CASH_SERVICE_OAUTH2_CLIENT_ID:cash-service}
            client-secret: ${CASH_SERVICE_OAUTH2_CLIENT_SECRET:hbWy1ujh5VRYh185ECjGmOktu7TjJMoH}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: "*"

bank:
  accounts-service:
    base-url: ${ACCOUNTS_SERVICE_URl:http://localhost:8081}
  notifications-service:
    base-url: ${NOTIFICATION_SERVICE_URl:http://localhost:8086}

logging:
  level:
    root: INFO
    org.springframework.webflux.function.server: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.security.oauth2.core: DEBUG
