version: '3'
services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config:/etc/prometheus
      - ./prometheus_data:/prometheus
    networks:
      - monitoring_network
    restart: unless-stopped


  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_network
    depends_on:
      - prometheus
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards
      - ./provisioning:/etc/grafana/provisioning
      - ./grafana_data:/var/lib/grafana  # для хранения данных Grafana
    restart: unless-stopped
networks:
  monitoring_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: