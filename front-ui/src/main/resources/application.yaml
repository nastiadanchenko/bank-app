spring:
  application:
    name: front-ui
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
    discovery:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${FRONT_UI_OAUTH2_CLIENT_ID:bank-ui}
            client-secret: ${FRONT_UI_OAUTH2_CLIENT_SECRET:ui-client-secret}
            scope: openid, profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}
  thymeleaf:
    cache: false


server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: debug
    org.springframework.security: DEBUG

