apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounts.fullname" . }}
  labels:
    app: accounts-service
    {{- include "accounts.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: accounts-service
    {{- include "accounts.selectorLabels" . | nindent 4 }}
