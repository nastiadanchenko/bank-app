apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cash.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "cash.fullname" . }}
    app.kubernetes.io/component: backend
data:
  SPRING_APPLICATION_NAME: {{ .Values.env.SPRING_APPLICATION_NAME | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: {{ .Values.env.SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI | quote }}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_PROVIDER: {{ .Values.env.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_PROVIDER | quote }}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_CLIENT_ID: {{ .Values.env.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_CLIENT_ID | quote }}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_AUTHORIZATION_GRANT_TYPE: {{ .Values.env.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASH_SERVICE_AUTHORIZATION_GRANT_TYPE | quote }}
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: {{ .Values.env.SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: {{ .Values.env.MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE | quote }}
  BANK_ACCOUNTS_SERVICE_BASE_URL: {{ .Values.env.BANK_ACCOUNTS_SERVICE_BASE_URL | quote }}
  LOGGING_LEVEL_ROOT: {{ .Values.env.LOGGING_LEVEL_ROOT | quote }}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: {{ .Values.env.LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB | quote }}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: {{ .Values.env.LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY | quote }}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CLIENT: {{ .Values.env.LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CLIENT | quote }}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CORE: {{ .Values.env.LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CORE | quote }}
  BOOTSTRAP_SERVERS: {{ .Values.env.BOOTSTRAP_SERVERS | quote }}