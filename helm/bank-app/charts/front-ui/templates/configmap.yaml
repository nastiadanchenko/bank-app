apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "front-ui.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "front-ui.fullname" . }}
    app.kubernetes.io/component: frontend
data:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
