apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "front-ui.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "front-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "front-ui.fullname" . }}:{{ .Values.service.port }}/actuator/health', '-O-', '--timeout=5']
  restartPolicy: Never
