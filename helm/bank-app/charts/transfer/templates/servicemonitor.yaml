apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "transfer.fullname" . }}-monitor
  labels:
    release: kube-prometheus-stack
    {{- include "transfer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: transfer-service
      {{- include "transfer.selectorLabels" . | nindent 4 }}
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s