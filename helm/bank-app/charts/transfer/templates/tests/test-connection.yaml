apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "transfer.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "transfer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "transfer.fullname" . }}:{{ .Values.service.port }}/actuator/health']
  restartPolicy: Never
