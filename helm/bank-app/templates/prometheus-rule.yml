apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bank-app-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: bank-app.rules
      rules:
        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service is down"
            description: "One of bank services is not responding."

        - alert: HighHttp5xx
          expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High rate of HTTP 5xx"
            description: "More than 5 HTTP 5xx responses in 5 minutes."

        - alert: NotificationSendFailed
          expr: increase(business_notification_failed_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Notification sending failed"
            description: "Kafka notification sending failed."