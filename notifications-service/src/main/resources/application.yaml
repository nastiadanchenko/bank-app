spring:
  application:
    name: notifications-service
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
    discovery:
      enabled: false

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          notifications-service:
            provider: keycloak
            client-id: ${NOTIFICATION_SERVICE_OAUTH2_CLIENT_ID:notifications-service}
            client-secret: ${NOTIFICATION_SERVICE_OAUTH2_CLIENT_SECRET:S6Go9yKeRwksV47vydTv6R9izMSBFzJM}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL":ttp://localhost:8085/realms/bank-realm}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: "*"

bank:
  accounts-service:
    base-url: ${ACCOUNTS_SERVICE_URl:http://localhost:8081}

logging:
  level:
    root: INFO
    org.springframework.webflux.function.server: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.security.oauth2.core: DEBUG