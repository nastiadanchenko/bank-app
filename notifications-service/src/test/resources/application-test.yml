spring:
  application:
    name: notifications-service
  config:
    activate:
      on-profile: test

  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8085/realms/bank-realm

      client:
        registration:
          notifications-service:
            provider: keycloak
            client-id: notifications-service
            client-secret: S6Go9yKeRwksV47vydTv6R9izMSBFzJM
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8085/realms/bank-realm

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: notificationRequest:yandex.workshop.api.model.NotificationRequest
      group-id: bank-notifications
      auto-offset-reset: earliest
    listener:
      idle-partition-event-interval: 60000 # 60 секунд

topic:
  notification: notifications

server:
  port: 8086

bank:
  accounts-service:
    base-url: http://localhost:8081
