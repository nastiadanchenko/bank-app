spring:
  application:
    name: transfer-service
  cloud:
    config:
      enabled: false
    consul:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: ${TRANSFER_SERVICE_OAUTH2_CLIENT_ID:transfer-service}
            client-secret: ${TRANSFER_SERVICE_OAUTH2_CLIENT_SECRET:xrBtLBR4QGuLpkOmCLBuL7qiUKkDDRhx}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: "*"

bank:
  accounts-service:
    base-url: ${ACCOUNTS_SERVICE_URl:http://localhost:8081}
  notifications-service:
    base-url: ${NOTIFICATION_SERVICE_URl:http://localhost:8086}

logging:
  level:
    root: INFO