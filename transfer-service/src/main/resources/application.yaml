spring:
  application:
    name: transfer-service
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

      client:
        registration:
          transfer-service:
            provider: keycloak
            client-id: ${TRANSFER_SERVICE_OAUTH2_CLIENT_ID:transfer-service}
            client-secret: ${TRANSFER_SERVICE_OAUTH2_CLIENT_SECRET:xrBtLBR4QGuLpkOmCLBuL7qiUKkDDRhx}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_OAUTH2_URL:http://localhost:8085/realms/bank-realm}

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      client-id: "5L6g3nShT-eMCtK--X86sw"
    producer:
      bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      client-id: "5L6g3nShT-eMCtK--X86sw"
      properties:
        spring.json.type.mapping: notificationRequest:yandex.workshop.api.model.NotificationRequest

topic:
  notification: notifications

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411//api/v2/spans}
  endpoint:
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

bank:
  accounts-service:
    base-url: ${ACCOUNTS_SERVICE_URl:http://localhost:8081}

logging:
  level:
    root: INFO